name: Daily news health

on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check sources without publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_FETCH_TIMEOUT_MS: 10000
        run: npm run fetch-news-candidates
      - name: Check production and source health
        if: always()
        run: node scripts/check-news-health.mjs
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-health
          path: reports/
          retention-days: 14
