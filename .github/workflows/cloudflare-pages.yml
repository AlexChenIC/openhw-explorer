name: Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify existing Vercel production and every course media file
        run: node scripts/verify-cva6-overview.mjs --base https://openhw-explorer.vercel.app --expected-commit 20dbf7084831e66a6d8e4ea4c03fb6f968a82cf2
